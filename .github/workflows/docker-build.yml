name: Build and Push Docker Image

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build JAR
        run: mvn -B package --file pom.xml -DskipTests

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # -------------------------------
      # Build image with commit SHA tag
      # -------------------------------
      - name: Build Docker image (SHA tag)
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/accounting:${{ github.sha }} .

      - name: Push Docker image (SHA tag)
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/accounting:${{ github.sha }}

      # -----------------------------------------------------
      # Update Kubernetes manifest with new image tag (SHA)
      # -----------------------------------------------------
      - name: Update deployment manifest
        run: |
          sed -i "s|image: .*/accounting:.*|image: ${{ secrets.DOCKERHUB_USERNAME }}/accounting:${{ github.sha }}|" accounting/manifests/deployment.yaml

      # -----------------------------------------
      # Commit & push updated manifest to GitHub
      # -----------------------------------------
      - name: Commit updated manifest
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add accounting/manifests/deployment.yaml
          git commit -m "Update image tag to ${{ github.sha }}"
          git push
