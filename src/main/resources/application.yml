spring:
  application:
    name: accounting
  config:
    import: "c:/accounting/database/database.properties"
  profiles:
    default: local
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
  jpa:
    hibernate:
      ddl-auto: none
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB
  mail:
    host: "${SMTP_HOST:}"
    port: "${SMTP_PORT:587}"
    username: "${SMTP_USERNAME:}"
    password: "${SMTP_PASSWORD:}"
    properties:
      mail:
        smtp:
          auth: "${SMTP_AUTH:true}"
          starttls:
            enable: "${SMTP_STARTTLS:true}"
  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false

server:
  port: 8080

app:
  logging:
    path: "${APP_LOG_PATH:logs}"
  attachments:
    max-size: 10485760
  invoice-mail:
    enabled: "${APP_INVOICE_MAIL_ENABLED:false}"
    from: "${INVOICE_MAIL_FROM:}"
  seed:
    reference-data:
      enabled: "${APP_SEED_REFERENCE_DATA_ENABLED:false}"
    vendor-data:
      enabled: "${APP_SEED_VENDOR_DATA_ENABLED:false}"
  bootstrap:
    admin:
      email: "${APP_BOOTSTRAP_ADMIN_EMAIL:root@example.com}"
      password: "${APP_BOOTSTRAP_ADMIN_PASSWORD:password}"
  security:
    super-admin-emails: "${APP_SUPER_ADMIN_EMAILS:djans@cogitosum.com}"

management:
  health:
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never
  info:
    env:
      enabled: false
    java:
      enabled: true
    os:
      enabled: true
