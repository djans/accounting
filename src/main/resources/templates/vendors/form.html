<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Fournisseur')}"></head>
<body>
<div class="portal-shell">
    <div th:replace="~{fragments/layout :: sidebar('vendors')}"></div>
    <main class="portal-main">
        <div th:replace="~{fragments/layout :: topbar(${isNew} ? 'Nouveau fournisseur' : 'Modifier le fournisseur')}"></div>
        <section class="portal-content">
            <div th:replace="~{fragments/layout :: flash}"></div>

            <div class="portal-card">
                <form th:action="${isNew} ? @{/vendors} : @{/vendors/{id}(id=${vendor.id})}"
                      th:object="${vendor}" method="post">
                    <div class="form-grid">
                        <div class="form-field">
                            <label>Nom du contact</label>
                            <input type="text" th:field="*{name}" required/>
                        </div>
                        <div class="form-field">
                            <label>Nom de l'entreprise</label>
                            <input type="text" th:field="*{businessName}" required/>
                        </div>
                        <div class="form-field">
                            <label>Courriel</label>
                            <input type="email" th:field="*{email}" required/>
                        </div>
                        <div class="form-field">
                            <label>Numéro d'entreprise (NEQ/BN)</label>
                            <input type="text" th:field="*{businessNumber}"/>
                        </div>
                        <div class="form-field full">
                            <label>Adresse</label>
                            <input type="text" th:field="*{address}" required/>
                        </div>
                        <div class="form-field">
                            <label>Ville</label>
                            <input type="text" th:field="*{city}" required/>
                        </div>
                        <div class="form-field">
                            <label>Province</label>
                            <select th:field="*{province}" required>
                                <option value="">Choisir…</option>
                                <option value="ON">Ontario</option>
                                <option value="QC">Québec</option>
                                <option value="BC">Colombie-Britannique</option>
                                <option value="AB">Alberta</option>
                                <option value="MB">Manitoba</option>
                                <option value="SK">Saskatchewan</option>
                                <option value="NS">Nouvelle-Écosse</option>
                                <option value="NB">Nouveau-Brunswick</option>
                                <option value="NL">Terre-Neuve-et-Labrador</option>
                                <option value="PE">Île-du-Prince-Édouard</option>
                                <option value="YT">Yukon</option>
                                <option value="NT">Territoires du Nord-Ouest</option>
                                <option value="NU">Nunavut</option>
                            </select>
                        </div>
                        <div class="form-field">
                            <label>Code postal</label>
                            <input type="text" th:field="*{postalCode}" required/>
                        </div>
                        <div class="form-field">
                            <label>Pays</label>
                            <input type="text" th:field="*{country}" required/>
                        </div>
                        <div class="form-field">
                            <label>Numéro TPS/TVH</label>
                            <input type="text" th:field="*{gstNumber}"/>
                        </div>
                        <div class="form-field">
                            <label>Numéro TVQ</label>
                            <input type="text" th:field="*{qstNumber}"/>
                        </div>
                    </div>

                    <div class="form-actions">
                        <a th:href="@{/vendors}" class="btn-portal btn-ghost">Annuler</a>
                        <button type="submit" class="btn-portal">
                            <i class="bi bi-check2"></i>
                            <span th:text="${isNew} ? 'Créer le fournisseur' : 'Enregistrer'">Save</span>
                        </button>
                    </div>
                </form>
            </div>
        </section>
    </main>
</div>
</body>
</html>
