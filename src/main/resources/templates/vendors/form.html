<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(#{nav.vendors})}"></head>
<body>
<div class="portal-shell">
<div th:replace="~{fragments/layout :: sidebar('vendors')}"></div>
<main class="portal-main">
<div th:replace="~{fragments/layout :: topbar(${isNew} ? #{party.newVendor} : #{party.editVendor})}"></div>
<section class="portal-content"><div th:replace="~{fragments/layout :: flash}"></div>
<div class="portal-card">
<form th:action="${isNew} ? @{/vendors} : @{/vendors/{id}(id=${vendor.id})}" th:object="${vendor}" method="post">
<div class="vendor-form-header">
    <label><span th:text="#{party.vendorName}">Vendor name</span><input th:field="*{businessName}" required></label>
    <label><span th:text="#{party.contactName}">Contact name</span><input th:field="*{name}" required></label>
    <label class="vendor-inactive"><input type="checkbox" th:field="*{inactive}"> <span th:text="#{party.inactiveVendor}">Vendor is inactive</span></label>
</div>
<nav class="vendor-tabs" role="tablist">
    <button type="button" class="vendor-tab active" data-tab="address" th:text="#{party.addressContact}">Address Info</button>
    <button type="button" class="vendor-tab" data-tab="payment" th:text="#{party.paymentSettings}">Payment Settings</button>
    <button type="button" class="vendor-tab" data-tab="tax" th:text="#{party.salesTaxSettings}">Sales Tax Settings</button>
    <button type="button" class="vendor-tab" data-tab="accounts" th:text="#{party.accountSettings}">Account Settings</button>
    <button type="button" class="vendor-tab" data-tab="additional" th:text="#{party.additionalInfo}">Additional Info</button>
</nav>
<div class="vendor-panel active" id="tab-address">
<h3 th:text="#{party.addressContact}">Address Info</h3>
<div class="form-grid">
<label class="form-field"><span th:text="#{party.companyName}">Company name</span><input th:field="*{companyName}"></label>
<label class="form-field"><span th:text="#{party.title}">Title</span><input th:field="*{title}"></label>
<label class="form-field"><span th:text="#{party.firstName}">First name</span><input th:field="*{firstName}"></label>
<label class="form-field"><span th:text="#{party.middleInitial}">Middle initial</span><input th:field="*{middleInitial}"></label>
<label class="form-field"><span th:text="#{party.lastName}">Last name</span><input th:field="*{lastName}"></label>
<label class="form-field"><span th:text="#{party.jobTitle}">Job title</span><input th:field="*{jobTitle}"></label>
<label class="form-field"><span th:text="#{party.mainPhone}">Main phone</span><input th:field="*{mainPhone}"></label>
<label class="form-field"><span th:text="#{party.workPhone}">Work phone</span><input th:field="*{workPhone}"></label>
<label class="form-field"><span th:text="#{party.mobile}">Mobile</span><input th:field="*{mobilePhone}"></label>
<label class="form-field"><span th:text="#{party.fax}">Fax</span><input th:field="*{fax}"></label>
<label class="form-field"><span th:text="#{party.email}">Main email</span><input type="email" th:field="*{email}" required></label>
<label class="form-field"><span th:text="#{party.ccEmail}">CC email</span><input type="email" th:field="*{ccEmail}"></label>
<label class="form-field"><span th:text="#{party.website}">Website</span><input th:field="*{website}"></label>
<label class="form-field"><span th:text="#{party.secondaryEmail}">Secondary email</span><input type="email" th:field="*{secondaryEmail}"></label>
<label class="form-field full"><span th:text="#{party.billingAddress}">Billed from</span><textarea th:field="*{address}" required></textarea></label>
<label class="form-field full"><span th:text="#{party.shippingAddress}">Shipped from</span><textarea th:field="*{shipFromAddress}"></textarea></label>
<label class="form-field"><span th:text="#{party.city}">City</span><input th:field="*{city}" required></label>
<label class="form-field"><span th:text="#{party.province}">Province</span><input th:field="*{province}" required></label>
<label class="form-field"><span th:text="#{party.postalCode}">Postal code</span><input th:field="*{postalCode}" required></label>
<label class="form-field"><span th:text="#{party.country}">Country</span><input th:field="*{country}" required></label>
</div></div>
<div class="vendor-panel" id="tab-payment"><h3 th:text="#{party.paymentSettings}">Payment Settings</h3><div class="form-grid">
<label class="form-field"><span th:text="#{party.accountNumber}">Account no.</span><input th:field="*{accountNumber}"></label>
<label class="form-field"><span th:text="#{party.creditLimit}">Credit limit</span><input type="number" step="0.01" th:field="*{creditLimit}"></label>
<label class="form-field"><span th:text="#{party.paymentTerms}">Payment terms</span><select th:field="*{paymentTerms}"><option value="" th:text="#{select.choose}">Select...</option><option value="Due on receipt" th:text="#{option.terms.dueOnReceipt}">Due on receipt</option><option value="Net 15" th:text="#{option.terms.net15}">Net 15</option><option value="Net 30" th:text="#{option.terms.net30}">Net 30</option><option value="Net 60" th:text="#{option.terms.net60}">Net 60</option></select></label>
<label class="form-field"><span th:text="#{party.billingRateLevel}">Billing rate level</span><input th:field="*{billingRateLevel}"></label>
<label class="form-field"><span th:text="#{party.printNameOnCheque}">Print name on cheque as</span><input th:field="*{printOnChequeAs}"></label>
</div></div>
<div class="vendor-panel" id="tab-tax"><h3 th:text="#{party.salesTaxSettings}">Sales Tax Settings</h3><div class="form-grid">
<label class="form-field full tax-agency-toggle"><span><input type="checkbox" th:field="*{taxAgency}" id="taxAgency"> <span th:text="#{party.taxAgency}">Vendor is a Sales Tax Agency</span></span></label>
<div id="taxAgencyFields" class="tax-agency-fields">
<div class="tax-section-title" th:text="#{party.taxAgencyInformation}">Sales Tax Agency Information</div>
<label class="form-field"><span th:text="#{party.salesTaxRegistration}">Sales tax registration no.</span><input th:field="*{salesTaxRegistrationNumber}"></label>
<label class="form-field"><span th:text="#{party.taxReturn}">Tax return</span><select th:field="*{taxReturnType}"><option value="" th:text="#{select.choose}">Select...</option><option value="GST/HST Return" th:text="#{option.taxReturnGstHst}">GST/HST Return</option><option value="BC Social Service Tax Return" th:text="#{option.taxReturnBc}">BC Social Service Tax Return</option><option value="Saskatchewan PST Return" th:text="#{option.taxReturnSaskatchewan}">Saskatchewan PST Return</option><option value="Manitoba Retail Sales Tax Return" th:text="#{option.taxReturnManitoba}">Manitoba Retail Sales Tax Return</option><option value="Ontario Retail Sales Tax Return" th:text="#{option.taxReturnOntario}">Ontario Retail Sales Tax Return</option><option value="GST/HST/QST Combined Return" th:text="#{option.taxReturnCombined}">GST/HST/QST Combined Return</option><option value="P.E.I. Revenue Tax Return" th:text="#{option.taxReturnPei}">P.E.I. Revenue Tax Return</option></select></label>
<label class="form-field"><span th:text="#{party.reportingPeriod}">Reporting period</span><select th:field="*{taxReportingPeriod}"><option value="" th:text="#{select.choose}">Select...</option><option value="Monthly" th:text="#{option.period.monthly}">Monthly</option><option value="Quarterly" th:text="#{option.period.quarterly}">Quarterly</option><option value="Annually" th:text="#{option.period.annually}">Annually</option></select></label>
<label class="form-field"><span th:text="#{party.taxLabel}">Tax label</span><input th:field="*{taxLabel}" placeholder="QST"></label>
<label class="form-field"><span th:text="#{party.periodEnding}">Period ending</span><select th:field="*{taxPeriodEnding}"><option value="" th:text="#{select.choose}">Select...</option><option value="Jan/Apr/Jul/Oct" th:text="#{option.periodEnd.janAprJulOct}">Jan/Apr/Jul/Oct</option><option value="Mar/Jun/Sep/Dec" th:text="#{option.periodEnd.marJunSepDec}">Mar/Jun/Sep/Dec</option><option value="Month end" th:text="#{option.periodEnd.monthEnd}">Month end</option></select></label>
<label class="form-field"><span th:text="#{party.qstRegistration}">QST registration no.</span><input th:field="*{qstNumber}"></label>
<div class="form-field full tax-account-options">
<span><input type="checkbox" th:field="*{trackSalesTaxSeparately}" id="trackSalesTax"> <span th:text="#{party.trackSalesTax}">Track tax on sales separately to</span></span>
<select th:field="*{salesTaxAccount}" id="salesTaxAccount"><option value="" th:text="#{select.chooseAccount}">Select account...</option><option th:each="a:${accounts}" th:value="${a.id}" th:text="${a.accountNumber+' - '+a.accountName+' ('+a.accountType+')'}"></option></select>
<span><input type="checkbox" th:field="*{trackPurchaseTaxSeparately}" id="trackPurchaseTax"> <span th:text="#{party.trackPurchaseTax}">Track tax on purchases separately to</span></span>
<select th:field="*{purchaseTaxAccount}" id="purchaseTaxAccount"><option value="" th:text="#{select.chooseAccount}">Select account...</option><option th:each="a:${accounts}" th:value="${a.id}" th:text="${a.accountNumber+' - '+a.accountName+' ('+a.accountType+')'}"></option></select>
</div>
<label class="form-field full"><span><input type="checkbox" th:field="*{taxOnOtherTaxes}"> <span th:text="#{party.taxOnOtherTaxes}">Taxes for this agency are calculated on other taxes</span></span><span><input type="checkbox" th:field="*{taxIncludedOnExpenses}"> <span th:text="#{party.taxIncludedOnExpenses}">Include this tax when billing for expenses</span></span></label>
</div>
</div></div>
<div class="vendor-panel" id="tab-accounts"><h3 th:text="#{party.accountSettings}">Account Settings</h3><p th:text="#{party.defaultExpenseAccountsDescription}">Default expense accounts used when entering bills for this vendor.</p><div class="form-grid">
<label class="form-field"><span th:text="#{party.expenseAccount1}">Expense account 1</span><select th:field="*{defaultExpenseAccount1}"><option value="" th:text="#{select.choose}">Select...</option><option th:each="a:${accounts}" th:value="${a.id}" th:text="${a.accountNumber+' - '+a.accountName}"></option></select></label>
<label class="form-field"><span th:text="#{party.expenseAccount2}">Expense account 2</span><select th:field="*{defaultExpenseAccount2}"><option value="" th:text="#{select.choose}">Select...</option><option th:each="a:${accounts}" th:value="${a.id}" th:text="${a.accountNumber+' - '+a.accountName}"></option></select></label>
<label class="form-field"><span th:text="#{party.expenseAccount3}">Expense account 3</span><select th:field="*{defaultExpenseAccount3}"><option value="" th:text="#{select.choose}">Select...</option><option th:each="a:${accounts}" th:value="${a.id}" th:text="${a.accountNumber+' - '+a.accountName}"></option></select></label>
</div></div>
<div class="vendor-panel" id="tab-additional"><h3 th:text="#{party.additionalInfo}">Additional Info</h3><div class="form-grid">
<label class="form-field"><span th:text="#{party.vendorType}">Vendor type</span><select th:field="*{vendorType}"><option value="" th:text="#{select.choose}">Select...</option><option value="Consultant" th:text="#{option.vendorConsultant}">Consultant</option><option value="Service Providers" th:text="#{option.vendorServiceProviders}">Service Providers</option><option value="Suppliers" th:text="#{option.vendorSuppliers}">Suppliers</option><option value="Supplies" th:text="#{option.vendorSupplies}">Supplies</option><option value="Tax agency" th:text="#{option.vendorTaxAgency}">Tax agency</option></select></label>
<label class="form-field full"><span th:text="#{party.customFields}">Custom fields</span><textarea th:field="*{customFields}" rows="6" th:placeholder="#{party.oneFieldPerLine}"></textarea></label>
</div></div>
<div class="form-actions"><a th:href="@{/vendors}" class="btn-portal btn-ghost" th:text="#{btn.cancel}">Cancel</a><button type="submit" class="btn-portal"><i class="bi bi-check2"></i> <span th:text="${isNew} ? #{party.createVendor} : #{form.saveChanges}">Save vendor</span></button></div>
</form></div></section></main></div>
<style>
.vendor-form-header{display:flex;gap:1rem;align-items:end;flex-wrap:wrap;margin-bottom:1rem}.vendor-form-header label{display:flex;flex-direction:column;gap:.3rem;font-weight:600}.vendor-form-header input{min-width:220px}.vendor-inactive{font-weight:400!important}.vendor-tabs{display:flex;flex-wrap:wrap;gap:.25rem;border-bottom:1px solid var(--portal-border);margin:0 -1rem 1rem;padding:0 1rem}.vendor-tab{border:0;background:#e5e7eb;padding:.7rem 1rem;cursor:pointer;border-radius:6px 6px 0 0}.vendor-tab.active{background:var(--portal-primary);color:#fff}.vendor-panel{display:none;min-height:300px}.vendor-panel.active{display:block}.vendor-panel h3{margin-top:0}.vendor-panel textarea{min-height:70px}.tax-agency-fields{display:none;grid-column:1/-1}.tax-agency-fields.visible{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1rem}.tax-section-title{grid-column:1/-1;text-transform:uppercase;font-size:.78rem;font-weight:700;border-bottom:1px solid var(--portal-border);padding-bottom:.5rem}.tax-account-options{display:grid;grid-template-columns:auto 1fr;gap:.6rem;align-items:center}.tax-account-options select{min-width:260px}
</style>
<script>
document.querySelectorAll('.vendor-tab').forEach(function(tab){tab.addEventListener('click',function(){document.querySelectorAll('.vendor-tab,.vendor-panel').forEach(function(e){e.classList.remove('active')});tab.classList.add('active');document.getElementById('tab-'+tab.dataset.tab).classList.add('active')})});
const agency=document.getElementById('taxAgency'), agencyFields=document.getElementById('taxAgencyFields');
function toggleAgency(){agencyFields.classList.toggle('visible',agency.checked)}
agency.addEventListener('change',toggleAgency); toggleAgency();
</script>
</body></html>
