<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(#{account.credentials.title})}"></head>
<body>
<div class="portal-shell">
    <div th:replace="~{fragments/layout :: sidebar(${active})}"></div>
    <main class="portal-main">
        <div th:replace="~{fragments/layout :: topbar(#{account.credentials.title})}"></div>
        <section class="portal-content">
            <div th:replace="~{fragments/layout :: flash}"></div>

            <div class="portal-card">
                <h3 class="portal-card-title"
                    th:text="${defaultCredentials} ? #{account.credentials.defaultTitle} : #{account.credentials.titlePrompt}">
                    Update your sign-in details
                </h3>
                <div th:if="${defaultCredentials}" class="alert alert-warning" role="alert">
                    <p th:text="#{account.credentials.defaultWarning}">
                        Change the initial credentials now or continue and you will be reminded again at your next sign-in.
                    </p>
                    <p class="mb-0" th:text="#{account.credentials.defaultPasswordHelp}">
                        Choose new sign-in details instead of the initial values.
                    </p>
                </div>
                <form th:action="@{/account/credentials}" method="post">
                    <div class="form-field">
                        <label for="credentials-email" th:text="#{account.credentials.email}">Email / username</label>
                        <input id="credentials-email" name="email" type="email" autocomplete="username" required
                               th:value="${requestedEmail ?: currentEmail}"/>
                    </div>
                    <div class="form-field">
                        <label for="credentials-password" th:text="#{account.credentials.newPassword}">New password</label>
                        <input id="credentials-password" name="newPassword" type="password"
                               autocomplete="new-password" minlength="12"
                               th:required="${defaultCredentials}"/>
                    </div>
                    <div class="form-field">
                        <label for="credentials-confirm-password" th:text="#{account.credentials.confirmPassword}">
                            Confirm new password
                        </label>
                        <input id="credentials-confirm-password" name="confirmPassword" type="password"
                               autocomplete="new-password" minlength="12"
                               th:required="${defaultCredentials}"/>
                    </div>
                    <p class="text-muted small" th:unless="${defaultCredentials}"
                       th:text="#{account.credentials.passwordHelp}">
                        Leave both password fields empty to keep the current password.
                    </p>
                    <div class="form-actions">
                        <button type="submit" class="btn-portal">
                            <i class="bi bi-shield-lock"></i>
                            <span th:text="#{account.credentials.submit}">Save credentials</span>
                        </button>
                        <a th:href="@{/account/credentials/continue}" class="btn-portal btn-ghost"
                           th:if="${defaultCredentials}" th:text="#{account.credentials.continue}">
                            Continue without changing credentials
                        </a>
                    </div>
                </form>
            </div>
        </section>
    </main>
</div>
</body>
</html>
