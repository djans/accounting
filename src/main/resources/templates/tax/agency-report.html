<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(#{nav.taxAgencyReport})}"></head>
<body>
<div class="portal-shell">
    <div th:replace="~{fragments/layout :: sidebar(${active})}"></div>
    <main class="portal-main">
        <div th:replace="~{fragments/layout :: topbar(|${agency.code} — ${agency.name}|)}"></div>
        <section class="portal-content">
            <div th:replace="~{fragments/layout :: flash}"></div>

            <div class="portal-card">
                <div class="d-flex align-items-center justify-content-between">
                    <h3 class="portal-card-title">
                        <span th:text="${agency.name}">Canada Revenue Agency</span>
                    </h3>
                    <div>
                        <button id="agency-refresh" class="btn-portal btn-sm"><i class="bi bi-arrow-clockwise"></i> Refresh</button>
                        <span id="agency-spinner" class="spinner-border spinner-border-sm ms-2" style="display:none"></span>
                        <a th:href="@{/tax/agencies}" class="btn-portal btn-ghost btn-sm ms-2">Back to agencies</a>
                    </div>
                </div>
                <div class="form-grid">
                    <div>
                        <div class="stat-label">Code</div>
                        <div th:text="${agency.code}">CRA</div>
                    </div>
                    <div>
                        <div class="stat-label">Account # with agency</div>
                        <div th:text="${agency.accountNumber}">123456789 RT 0001</div>
                    </div>
                    <div>
                        <div class="stat-label">Website</div>
                        <div>
                            <a th:if="${agency.website}" th:href="${agency.website}" target="_blank"
                               th:text="${agency.website}">link</a>
                        </div>
                    </div>
                </div>
            </div>

            <div id="agency-report" th:attr="data-agency-id=${agency.id}">
                <div class="report-totals" style="margin:1.25rem 0">
                    <div class="stat-card">
                        <div class="stat-label">Total Tax Collected</div>
                        <div class="stat-value" th:text="${#numbers.formatCurrency(totalCollected)}">$0</div>
                    </div>
                    <div class="stat-card is-accent">
                        <div class="stat-label">Total ITC Claimed</div>
                        <div class="stat-value" th:text="${#numbers.formatCurrency(totalItc)}">$0</div>
                    </div>
                    <div class="stat-card is-success">
                        <div class="stat-label">Total Net Owed</div>
                        <div class="stat-value" th:text="${#numbers.formatCurrency(totalNet)}">$0</div>
                    </div>
                </div>
            </div>

            <div class="portal-card">
                <h3 class="portal-card-title">Filing History</h3>
                <div th:if="${#lists.isEmpty(periods)}" class="empty-state">
                    No filing periods recorded for this agency.
                </div>
                <table th:if="${not #lists.isEmpty(periods)}" class="table-portal">
                    <thead>
                    <tr>
                        <th th:text="#{table.period}">Period</th>
                        <th th:text="#{table.status}">Status</th>
                        <th class="num" th:text="#{table.collected}">Collected</th>
                        <th class="num" th:text="#{table.itc}">ITC</th>
                        <th class="num" th:text="#{table.netOwing}">Net Owing</th>
                        <th th:text="#{table.filed}">Filed</th>
                        <th th:text="#{table.paid}">Paid</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="p : ${periods}">
                        <td>
                            <a th:href="@{/tax/periods/{id}(id=${p.id})}"
                               th:text="${p.periodStart + ' → ' + p.periodEnd}">2026-Q1</a>
                        </td>
                        <td><span class="badge-pill" th:text="${p.status}">OPEN</span></td>
                        <td class="num" th:text="${#numbers.formatCurrency(p.taxCollected)}">$0</td>
                        <td class="num" th:text="${#numbers.formatCurrency(p.taxItc)}">$0</td>
                        <td class="num" th:text="${#numbers.formatCurrency(p.netOwing)}">$0</td>
                        <td th:text="${p.filedDate}">—</td>
                        <td th:text="${p.paidDate}">—</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>
</div>
<script th:src="@{/js/tax-agency-refresh.js}"></script>
</body>
</html>
