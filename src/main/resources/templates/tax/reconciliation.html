<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(#{nav.reconciliation})}"></head>
<body>
<div class="portal-shell">
    <div th:replace="~{fragments/layout :: sidebar(${active})}"></div>
    <main class="portal-main">
        <div th:replace="~{fragments/layout :: topbar(#{nav.reconciliation})}"></div>
        <section class="portal-content">
            <div th:replace="~{fragments/layout :: flash}"></div>

            <div class="portal-card">
                <div class="d-flex align-items-center justify-content-between">
                    <h3 class="portal-card-title" th:text="#{tax.recon.title}">Payable Account Balances</h3>
                    <div>
                        <button id="recon-refresh" class="btn-portal btn-sm"><i class="bi bi-arrow-clockwise"></i> <span th:text="#{tax.recon.refresh}">Refresh</span></button>
                        <span id="recon-spinner" class="spinner-border spinner-border-sm ms-2" style="display:none"></span>
                    </div>
                </div>
                <p class="text-muted" th:text="#{tax.recon.description}">
                    Live balance on each tax payable account in the General Ledger.
                    This is what you currently owe to each agency from invoices already posted, minus any ITC adjustments or payments.
                </p>
                <table class="table-portal">
                    <thead>
                    <tr>
                        <th th:text="#{tax.recon.agency}">Agency</th>
                        <th th:text="#{tax.recon.taxCode}">Tax Code</th>
                        <th th:text="#{tax.recon.account}">Account</th>
                        <th class="num" th:text="#{tax.recon.glBalance}">GL Balance</th>
                    </tr>
                    </thead>
                    <tbody id="recon-tbody">
                    <tr th:each="row : ${rows}">
                        <td th:text="${row.agency.code + ' — ' + row.agency.name}">CRA — Canada Revenue Agency</td>
                        <td th:text="${row.code.code + ' (' + row.code.name + ')'}">TPS</td>
                        <td th:text="${row.account.accountNumber + ' – ' + row.account.accountName}">2310 – TPS Payable</td>
                        <td class="num" th:text="${#numbers.formatCurrency(row.glBalance)}">$0</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>
</div>
<script th:src="@{/js/tax-reconciliation-refresh.js}"></script>
</body>
</html>
