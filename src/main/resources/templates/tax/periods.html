<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(#{tax.periods.title})}"></head>
<body>
<div class="portal-shell">
    <div th:replace="~{fragments/layout :: sidebar(${active})}"></div>
    <main class="portal-main">
        <div th:replace="~{fragments/layout :: topbar(#{tax.periods.title})}"></div>
        <section class="portal-content">
            <div th:replace="~{fragments/layout :: flash}"></div>

            <div class="portal-card">
                <div class="d-flex align-items-center justify-content-between">
                    <h3 class="portal-card-title" th:text="#{tax.periods.all}">All Filing Periods</h3>
                    <div>
                        <button id="periods-refresh" class="btn-portal btn-sm"><i class="bi bi-arrow-clockwise"></i> <span th:text="#{tax.periods.refresh}">Refresh</span></button>
                        <span id="periods-spinner" class="spinner-border spinner-border-sm ms-2" style="display:none"></span>
                    </div>
                </div>
                <div th:if="${#lists.isEmpty(periods)}" class="empty-state" th:text="#{tax.periods.noPeriods}">
                    No periods yet. Create one below.
                </div>
                <table th:if="${not #lists.isEmpty(periods)}" class="table-portal">
                    <thead>
                    <tr>
                        <th th:text="#{tax.periods.agency}">Agency</th>
                        <th th:text="#{tax.periods.start}">Start</th>
                        <th th:text="#{tax.periods.end}">End</th>
                        <th th:text="#{tax.periods.status}">Status</th>
                        <th class="num" th:text="#{tax.periods.collected}">Collected</th>
                        <th class="num" th:text="#{tax.periods.itc}">ITC</th>
                        <th class="num" th:text="#{tax.periods.netOwing}">Net Owing</th>
                        <th th:text="#{tax.periods.filed}">Filed</th>
                        <th th:text="#{tax.periods.paid}">Paid</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="p : ${periods}">
                        <td th:text="${p.agency.code}">CRA</td>
                        <td th:text="${p.periodStart}">2026-01-01</td>
                        <td>
                            <a th:href="@{/tax/periods/{id}(id=${p.id})}" th:text="${p.periodEnd}">2026-03-31</a>
                        </td>
                        <td><span class="badge-pill" th:text="${p.status}">OPEN</span></td>
                        <td class="num" th:text="${#numbers.formatCurrency(p.taxCollected)}">$0</td>
                        <td class="num" th:text="${#numbers.formatCurrency(p.taxItc)}">$0</td>
                        <td class="num" th:text="${#numbers.formatCurrency(p.netOwing)}">$0</td>
                        <td th:text="${p.filedDate}">—</td>
                        <td th:text="${p.paidDate}">—</td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <div class="portal-card">
                <h3 class="portal-card-title" th:text="#{tax.periods.new}">New Filing Period</h3>
                <form th:action="@{/tax/periods}" method="post">
                    <div class="form-grid">
                        <div class="form-field">
                            <label th:text="#{tax.periods.agency}">Agency</label>
                            <select name="agencyId" required>
                                <option value="" th:text="#{tax.periods.selectAgency}">Select…</option>
                                <option th:each="a : ${agencies}" th:if="${a.active}" th:value="${a.id}" th:text="${a.code + ' — ' + a.name}"></option>
                            </select>
                        </div>
                        <div class="form-field">
                            <label th:text="#{tax.periods.periodStart}">Period Start</label>
                            <input type="date" name="periodStart" required/>
                        </div>
                        <div class="form-field">
                            <label th:text="#{tax.periods.periodEnd}">Period End</label>
                            <input type="date" name="periodEnd" required/>
                        </div>
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn-portal"><i class="bi bi-plus-lg"></i> <span th:text="#{tax.periods.create}">Create Period</span></button>
                    </div>
                </form>
            </div>
        </section>
    </main>
</div>
<script th:src="@{/js/tax-periods-refresh.js}"></script>
</body>
</html>
