<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Tax Filing Periods')}"></head>
<body>
<div class="portal-shell">
    <div th:replace="~{fragments/layout :: sidebar('tax-periods')}"></div>
    <main class="portal-main">
        <div th:replace="~{fragments/layout :: topbar('Tax Filing Periods')}"></div>
        <section class="portal-content">
            <div th:replace="~{fragments/layout :: flash}"></div>

            <div class="portal-card">
                <h3 class="portal-card-title">All Filing Periods</h3>
                <div th:if="${#lists.isEmpty(periods)}" class="empty-state">
                    No periods yet. Create one below.
                </div>
                <table th:if="${not #lists.isEmpty(periods)}" class="table-portal">
                    <thead>
                    <tr>
                        <th>Agency</th>
                        <th>Start</th>
                        <th>End</th>
                        <th>Status</th>
                        <th class="num">Collected</th>
                        <th class="num">ITC</th>
                        <th class="num">Net Owing</th>
                        <th>Filed</th>
                        <th>Paid</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="p : ${periods}">
                        <td th:text="${p.agency.code}">CRA</td>
                        <td th:text="${p.periodStart}">2026-01-01</td>
                        <td>
                            <a th:href="@{/tax/periods/{id}(id=${p.id})}" th:text="${p.periodEnd}">2026-03-31</a>
                        </td>
                        <td><span class="badge-pill" th:text="${p.status}">OPEN</span></td>
                        <td class="num" th:text="${#numbers.formatCurrency(p.taxCollected)}">$0</td>
                        <td class="num" th:text="${#numbers.formatCurrency(p.taxITC)}">$0</td>
                        <td class="num" th:text="${#numbers.formatCurrency(p.netOwing)}">$0</td>
                        <td th:text="${p.filedDate}">—</td>
                        <td th:text="${p.paidDate}">—</td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <div class="portal-card">
                <h3 class="portal-card-title">New Filing Period</h3>
                <form th:action="@{/tax/periods}" method="post">
                    <div class="form-grid">
                        <div class="form-field">
                            <label>Agency</label>
                            <select name="agencyId" required>
                                <option value="">Select…</option>
                                <option th:each="a : ${agencies}" th:value="${a.id}" th:text="${a.code + ' — ' + a.name}"></option>
                            </select>
                        </div>
                        <div class="form-field">
                            <label>Period Start</label>
                            <input type="date" name="periodStart" required/>
                        </div>
                        <div class="form-field">
                            <label>Period End</label>
                            <input type="date" name="periodEnd" required/>
                        </div>
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn-portal"><i class="bi bi-plus-lg"></i> Create Period</button>
                    </div>
                </form>
            </div>
        </section>
    </main>
</div>
</body>
</html>
