<!DOCTYPE html>
<html lang="en" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(#{cheques.title})}"></head>
<body>
<div class="portal-shell">
    <div th:replace="~{fragments/layout :: sidebar('cheques')}"></div>
    <main class="portal-main">
        <div th:replace="~{fragments/layout :: topbar(#{cheques.title})}"></div>
        <section class="portal-content">
            <div th:replace="~{fragments/layout :: flash}"></div>
            <div class="portal-card">
                <h3 class="portal-card-title" th:text="#{cheques.title}">Cheques</h3>
                <a th:href="@{/cheques/new}" class="btn-portal icon-action cheque-new-action"
                   data-bs-toggle="tooltip" data-bs-placement="top"
                   th:title="#{cheques.newDraft}" th:attr="aria-label=#{cheques.newDraft}">
                    <i class="bi bi-plus-lg" aria-hidden="true"></i>
                </a>
                <div th:if="${not #lists.isEmpty(cheques)}"
                     class="d-flex align-items-end gap-2 flex-wrap mb-3"
                     data-list-filter
                     data-rows-selector="#chequeRows tr[data-list-date]"
                     data-no-matches-selector="#chequesNoMatches"
                     data-vendor-filter-id="chequeVendorFilter"
                     data-text-filter-id="chequesFilter"
                     th:attr="data-current-period-start=${dateFilterPeriods.current != null ? dateFilterPeriods.current.startDate : ''},
                              data-current-period-end=${dateFilterPeriods.current != null ? dateFilterPeriods.current.endDate : ''},
                              data-previous-period-start=${dateFilterPeriods.previous != null ? dateFilterPeriods.previous.startDate : ''},
                              data-previous-period-end=${dateFilterPeriods.previous != null ? dateFilterPeriods.previous.endDate : ''}">
                    <div>
                        <label class="form-label mb-1" for="chequeDatePreset"
                               th:text="#{listFilter.dateLabel}">Filter by date</label>
                        <select id="chequeDatePreset" class="form-select form-select-sm" data-date-preset>
                            <option value="all" th:text="#{listFilter.allDates}">All dates</option>
                            <option value="this-month" th:text="#{listFilter.thisMonth}">This month</option>
                            <option value="current-period" th:if="${dateFilterPeriods.current != null}"
                                    th:text="#{listFilter.currentPeriod(${dateFilterPeriods.current.agencyCode}, ${dateFilterPeriods.current.startDate}, ${dateFilterPeriods.current.endDate})}">
                                Current tax filing period
                            </option>
                            <option value="" disabled="disabled" th:unless="${dateFilterPeriods.current != null}"
                                    th:text="#{listFilter.noCurrentTaxPeriod}">No open tax filing period</option>
                            <option value="previous-period" th:if="${dateFilterPeriods.previous != null}"
                                    th:text="#{listFilter.previousPeriod(${dateFilterPeriods.previous.agencyCode}, ${dateFilterPeriods.previous.startDate}, ${dateFilterPeriods.previous.endDate})}">
                                Previous tax filing period
                            </option>
                            <option value="" disabled="disabled" th:unless="${dateFilterPeriods.previous != null}"
                                    th:text="#{listFilter.noPreviousTaxPeriod}">No previous filed tax period</option>
                            <option value="this-year" th:text="#{listFilter.thisYear}">This year</option>
                            <option value="last-year" th:text="#{listFilter.lastYear}">Last year</option>
                            <option value="custom" th:text="#{listFilter.customRange}">Custom range</option>
                        </select>
                    </div>
                    <div class="d-flex align-items-end gap-2" data-custom-date-range hidden>
                        <div>
                            <label class="form-label mb-1" for="chequeDateFrom"
                                   th:text="#{listFilter.from}">From</label>
                            <input id="chequeDateFrom" type="date" class="form-control form-control-sm" data-date-from/>
                        </div>
                        <div>
                            <label class="form-label mb-1" for="chequeDateTo"
                                   th:text="#{listFilter.to}">To</label>
                            <input id="chequeDateTo" type="date" class="form-control form-control-sm" data-date-to/>
                        </div>
                    </div>
                    <small class="text-danger" data-filter-range-error hidden
                           th:text="#{listFilter.invalidDateRange}">Start date must be on or before the end date.</small>
                    <div>
                        <label class="form-label mb-1" for="chequeVendorFilter"
                               th:text="#{listFilter.vendorLabel}">Filter by vendor</label>
                        <select id="chequeVendorFilter" class="form-select form-select-sm" data-vendor-filter>
                            <option value="" th:text="#{listFilter.allVendors}">All vendors</option>
                            <option th:each="vendor : ${vendors}" th:value="${vendor.id}"
                                    th:text="${vendor.businessName}">Vendor</option>
                        </select>
                    </div>
                    <div>
                        <label class="form-label mb-1" for="chequesFilter"
                               th:text="#{listFilter.textLabel}">Filter this list</label>
                        <input id="chequesFilter" type="search" class="form-control form-control-sm"
                               th:attr="placeholder=#{listFilter.textPlaceholder}"/>
                    </div>
                </div>
                <div id="chequesNoMatches" class="empty-state" hidden th:text="#{listFilter.noMatches}">
                    No records match these filters.
                </div>
                <table class="table-portal" data-table-totals th:if="${not #lists.isEmpty(cheques)}">
                    <thead>
                    <tr>
                        <th th:text="#{table.chequeNumber}">Cheque #</th>
                        <th th:text="#{table.vendor}">Vendor</th>
                        <th th:text="#{table.date}">Date</th>
                        <th class="num" th:text="#{table.amount}">Amount</th>
                        <th th:text="#{table.status}">Status</th>
                        <th th:text="#{table.actions}">Actions</th>
                    </tr>
                    </thead>
                    <tbody id="chequeRows">
                    <tr th:each="p : ${cheques}"
                        th:attr="data-list-date=${p.chequeDate},data-list-vendor-id=${p.vendor.id}">
                        <td th:text="${p.chequeNumber}">1</td>
                        <td th:text="${p.vendor.businessName}">Vendor</td>
                        <td th:text="${p.chequeDate}">2026-01-01</td>
                        <td class="num" data-total-key="amount" th:attr="data-total-value=${p.amount}"
                            th:text="${#numbers.formatCurrency(p.amount)}">$0</td>
                        <td>
                            <span class="badge-pill"
                                  th:classappend="${' ' + #strings.toLowerCase(p.status.name())}"
                                  th:text="${#messages.msg('cheques.status.' + #strings.toLowerCase(p.status.name()))}">ISSUED</span>
                            <div th:if="${p.voidReason != null}" class="text-muted small"
                                 th:text="${#messages.msg('cheques.voidReason') + ': ' + p.voidReason}">Reason</div>
                            <div th:if="${p.voidedAt != null}" class="text-muted small">
                                <span th:text="#{cheques.voidedAt}">Voided on</span>
                                <span th:text="${p.voidedAt}">2026-01-01T00:00</span>
                            </div>
                            <div th:if="${p.reissueOf != null}" class="text-muted small">
                                <span th:text="#{cheques.reissueOf}">Reissue of</span>
                                <span th:text="${p.reissueOf.chequeNumber}">1</span>
                            </div>
                        </td>
                        <td class="cheque-actions">
                            <a th:href="@{/cheques/{id}/copy(id=${p.id})}"
                               class="btn-portal btn-ghost btn-sm icon-action"
                               data-bs-toggle="tooltip" data-bs-placement="top"
                               th:title="#{cheques.copy}"
                               th:attr="aria-label=#{cheques.copy}">
                                <i class="bi bi-copy" aria-hidden="true"></i>
                            </a>
                            <a th:if="${p.status.name() == 'DRAFT'}"
                               th:href="@{/cheques/{id}/edit(id=${p.id})}"
                               class="btn-portal btn-icon-action btn-icon-edit icon-action"
                               data-bs-toggle="tooltip" data-bs-placement="top"
                               th:title="#{cheques.edit}" th:attr="aria-label=#{cheques.edit}">
                                <i class="bi bi-pencil" aria-hidden="true"></i>
                            </a>
                            <form th:if="${p.status.name() == 'DRAFT'}"
                                  th:action="@{/cheques/{id}/delete(id=${p.id})}" method="post">
                                <button class="btn-portal btn-icon-action btn-icon-delete icon-action" type="submit"
                                        data-bs-toggle="tooltip" data-bs-placement="top"
                                        th:title="#{cheques.deleteDraft}"
                                        th:attr="aria-label=#{cheques.deleteDraft}, data-confirm-message=${#messages.msg('cheques.confirmDeleteDraft')}"
                                        onclick="return confirm(this.dataset.confirmMessage)"
                                        >
                                    <i class="bi bi-x-lg" aria-hidden="true"></i>
                                </button>
                            </form>
                            <form th:if="${p.status.name() == 'DRAFT'}"
                                  th:action="@{/cheques/{id}/issue(id=${p.id})}" method="post">
                                <button class="btn-portal btn-sm icon-action" type="submit"
                                        data-bs-toggle="tooltip" data-bs-placement="top"
                                        th:title="#{cheques.issue}" th:attr="aria-label=#{cheques.issue}">
                                    <i class="bi bi-check-circle" aria-hidden="true"></i>
                                </button>
                            </form>
                            <form th:if="${p.status.name() == 'ISSUED'}"
                                  th:action="@{/cheques/{id}/void(id=${p.id})}" method="post">
                                <input type="text" name="reason" maxlength="180" required
                                       th:placeholder="#{cheques.voidReasonPlaceholder}"
                                       th:attr="aria-label=${#messages.msg('cheques.voidReason')}"/>
                                <button class="btn-portal btn-ghost btn-sm icon-action" type="submit"
                                        data-bs-toggle="tooltip" data-bs-placement="top"
                                        th:title="#{cheques.void}"
                                        th:attr="aria-label=#{cheques.void}, data-confirm-message=${#messages.msg('cheques.confirmVoid')}"
                                        onclick="return confirm(this.dataset.confirmMessage)"
                                        >
                                    <i class="bi bi-x-circle" aria-hidden="true"></i>
                                </button>
                            </form>
                            <a th:if="${p.status.name() == 'VOIDED'}"
                               th:href="@{/cheques/new(reissueOfId=${p.id})}"
                               class="btn-portal btn-ghost btn-sm icon-action"
                               data-bs-toggle="tooltip" data-bs-placement="top"
                               th:title="#{cheques.reissue}" th:attr="aria-label=#{cheques.reissue}">
                                <i class="bi bi-arrow-repeat" aria-hidden="true"></i>
                            </a>
                        </td>
                    </tr>
                    </tbody>
                    <tfoot>
                    <tr>
                        <td colspan="3" th:text="#{table.totals}">Totals</td>
                        <td class="num" data-total-cell="amount">$0.00</td>
                        <td colspan="2"></td>
                    </tr>
                    </tfoot>
                </table>
                <div th:if="${#lists.isEmpty(cheques)}" class="empty-state">No cheques recorded yet.</div>
            </div>
        </section>
    </main>
</div>
<script th:src="@{/js/table-totals.js}"></script>
<script th:src="@{/js/list-filters.js}"></script>
<style>
    .cheque-new-action { margin-bottom: 1rem; }
    .cheque-actions { white-space: nowrap; }
    .cheque-actions form { display: inline-flex; align-items: center; margin: 0; }
    .icon-action { width: 2.35rem; height: 2.35rem; justify-content: center; padding: 0; }
    .btn-portal.icon-action i { margin: 0; }
</style>
<script>
    document.querySelectorAll('[data-bs-toggle="tooltip"]').forEach(function (element) {
        if (window.bootstrap && window.bootstrap.Tooltip) {
            new window.bootstrap.Tooltip(element);
        }
    });
</script>
</body>
</html>
