<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(#{admin.schemaReset.title})}"></head>
<body>
<div class="portal-shell">
    <div th:replace="~{fragments/layout :: sidebar(${active})}"></div>
    <main class="portal-main">
        <div th:replace="~{fragments/layout :: topbar(#{admin.schemaReset.title})}"></div>
        <section class="portal-content">
            <div th:replace="~{fragments/layout :: flash}"></div>

            <div class="portal-card">
                <h3 class="portal-card-title" th:text="#{admin.schemaReset.warningTitle}">Destructive database operation</h3>
                <div class="alert alert-danger" role="alert">
                    <p th:text="#{admin.schemaReset.warning}">
                        This permanently deletes all data, including companies and user accounts, then recreates the schema.
                    </p>
                    <a th:href="@{/database/backup/export}" th:text="#{admin.schemaReset.backupLink}">
                        Download a database backup first
                    </a>
                </div>
                <p th:text="#{admin.schemaReset.restart}">
                    Restart and sign in with root@example.com and password, then change those initial credentials.
                </p>
                <form th:action="@{/admin/database/recreate}" method="post">
                    <div class="form-field">
                        <label for="schema-reset-confirmation" th:text="#{admin.schemaReset.typePrompt}">
                            Type DROP AND RECREATE to confirm
                        </label>
                        <input id="schema-reset-confirmation" type="text" name="confirmation"
                               required pattern="DROP AND RECREATE" autocomplete="off"/>
                    </div>
                    <label class="d-flex align-items-center gap-2 my-3">
                        <input type="checkbox" name="confirmReset" value="true" required/>
                        <span th:text="#{admin.schemaReset.checkbox}">
                            I understand all database data, including user accounts, will be permanently deleted.
                        </span>
                    </label>
                    <div class="form-actions">
                        <button type="submit" class="btn-portal btn-danger"
                                th:data-confirm="#{admin.schemaReset.browserConfirm}"
                                onclick="return confirm(this.getAttribute('data-confirm'))">
                            <i class="bi bi-database-x"></i>
                            <span th:text="#{admin.schemaReset.submit}">Drop and recreate database</span>
                        </button>
                    </div>
                </form>
            </div>
        </section>
    </main>
</div>
</body>
</html>
