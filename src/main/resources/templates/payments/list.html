<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Payments')}"></head>
<body>
<div class="portal-shell">
    <div th:replace="~{fragments/layout :: sidebar('payments')}"></div>
    <main class="portal-main">
        <div th:replace="~{fragments/layout :: topbar('Payments')}"></div>
        <section class="portal-content">
            <div th:replace="~{fragments/layout :: flash}"></div>

            <div class="portal-card">
                <div class="portal-card-title d-flex justify-content-between align-items-center flex-wrap gap-2">
                    <span>All Payments</span>
                    <div class="d-flex gap-2">
                        <a th:href="@{/payments/customer}" class="btn-portal btn-ghost">
                            <i class="bi bi-person"></i>
                            <span th:text="#{payments.payMultipleInvoices}">Paiement de plusieurs factures</span>
                        </a>
                        <a th:href="@{/payments/new}" class="btn-portal">
                            <i class="bi bi-plus-lg"></i>
                            <span th:text="#{payments.payOneInvoice}">Paiement d'une facture</span>
                        </a>
                    </div>
                </div>
                <div class="d-flex align-items-end gap-2 flex-wrap mb-3"
                     data-list-filter
                     data-rows-selector="#paymentRows tr[data-list-date]"
                     data-no-matches-selector="#paymentFilterNoMatches"
                     data-customer-filter-id="paymentCustomerFilter"
                     th:attr="data-current-period-start=${dateFilterPeriods.current != null ? dateFilterPeriods.current.startDate : ''},
                              data-current-period-end=${dateFilterPeriods.current != null ? dateFilterPeriods.current.endDate : ''},
                              data-previous-period-start=${dateFilterPeriods.previous != null ? dateFilterPeriods.previous.startDate : ''},
                              data-previous-period-end=${dateFilterPeriods.previous != null ? dateFilterPeriods.previous.endDate : ''}">
                    <div>
                        <label class="form-label mb-1" for="paymentDatePreset"
                               th:text="#{listFilter.dateLabel}">Filter by date</label>
                        <select id="paymentDatePreset" class="form-select form-select-sm" data-date-preset>
                            <option value="all" th:text="#{listFilter.allDates}">All dates</option>
                            <option value="this-month" th:text="#{listFilter.thisMonth}">This month</option>
                            <option value="current-period" th:if="${dateFilterPeriods.current != null}"
                                    th:text="#{listFilter.currentPeriod(${dateFilterPeriods.current.agencyCode}, ${dateFilterPeriods.current.startDate}, ${dateFilterPeriods.current.endDate})}">
                                Current tax filing period
                            </option>
                            <option value="" disabled="disabled" th:unless="${dateFilterPeriods.current != null}"
                                    th:text="#{listFilter.noCurrentTaxPeriod}">No open tax filing period</option>
                            <option value="previous-period" th:if="${dateFilterPeriods.previous != null}"
                                    th:text="#{listFilter.previousPeriod(${dateFilterPeriods.previous.agencyCode}, ${dateFilterPeriods.previous.startDate}, ${dateFilterPeriods.previous.endDate})}">
                                Previous tax filing period
                            </option>
                            <option value="" disabled="disabled" th:unless="${dateFilterPeriods.previous != null}"
                                    th:text="#{listFilter.noPreviousTaxPeriod}">No previous filed tax period</option>
                            <option value="this-year" th:text="#{listFilter.thisYear}">This year</option>
                            <option value="last-year" th:text="#{listFilter.lastYear}">Last year</option>
                            <option value="custom" th:text="#{listFilter.customRange}">Custom range</option>
                        </select>
                    </div>
                    <div class="d-flex align-items-end gap-2" data-custom-date-range hidden>
                        <div>
                            <label class="form-label mb-1" for="paymentDateFrom"
                                   th:text="#{listFilter.from}">From</label>
                            <input id="paymentDateFrom" type="date" class="form-control form-control-sm" data-date-from/>
                        </div>
                        <div>
                            <label class="form-label mb-1" for="paymentDateTo"
                                   th:text="#{listFilter.to}">To</label>
                            <input id="paymentDateTo" type="date" class="form-control form-control-sm" data-date-to/>
                        </div>
                    </div>
                    <small class="text-danger" data-filter-range-error hidden
                           th:text="#{listFilter.invalidDateRange}">Start date must be before the end date.</small>
                    <div>
                        <label class="form-label mb-1" for="paymentCustomerFilter"
                               th:text="#{listFilter.customerLabel}">Filter by customer</label>
                        <select id="paymentCustomerFilter" class="form-select form-select-sm" data-customer-filter>
                            <option value="" th:text="#{listFilter.allCustomers}">All customers</option>
                            <option th:each="customer : ${customers}" th:value="${customer.id}"
                                    th:text="${customer.businessName}">Customer</option>
                        </select>
                    </div>
                </div>
                <div th:if="${#lists.isEmpty(payments)}" class="empty-state">
                    <span th:text="#{payments.noPayments}">No payments yet.</span>
                </div>
                <div id="paymentFilterNoMatches" class="empty-state" hidden
                     th:text="#{listFilter.noMatches}">No payments match these filters.</div>
                <table th:if="${not #lists.isEmpty(payments)}" class="table-portal">
                    <thead>
                    <tr>
                        <th th:text="#{table.transaction}">Transaction</th>
                        <th th:text="#{table.invoice}">Invoice</th>
                        <th th:text="#{table.customer}">Customer</th>
                        <th th:text="#{table.date}">Date</th>
                        <th th:text="#{table.method}">Method</th>
                        <th th:text="#{table.status}">Status</th>
                        <th class="num" th:text="#{table.amount}">Amount</th>
                        <th></th>
                    </tr>
                    </thead>
                    <tbody id="paymentRows">
                    <tr th:each="p : ${payments}"
                        th:attr="data-list-date=${p.paymentDate},
                                 data-list-customer-id=${p.invoice != null and p.invoice.customer != null ? p.invoice.customer.id : ''}">
                        <td th:text="${p.transactionId}">TXN-1</td>
                        <td>
                            <a th:href="@{/invoices/{id}(id=${p.invoice.id})}"
                               th:text="${p.invoice.invoiceNumber}">INV-1</a>
                        </td>
                        <td th:text="${p.invoice != null and p.invoice.customer != null
                                      ? p.invoice.customer.businessName : '—'}">Customer</td>
                        <td th:text="${p.paymentDate}">2026-01-01</td>
                        <td th:text="${p.paymentMethod}">CASH</td>
                        <td>
                            <span class="badge-pill"
                                  th:classappend="${' ' + #strings.toLowerCase(p.status.name())}"
                                  th:text="${p.status}"></span>
                        </td>
                        <td class="num" th:text="${#numbers.formatCurrency(p.amount)}">$0</td>
                        <td style="text-align:right; white-space:nowrap;">
                            <form th:if="${p.status.name() == 'PENDING'}"
                                  th:action="@{/payments/{id}/complete(id=${p.id})}" method="post" style="display:inline">
                                <button class="btn-portal btn-success btn-sm"><i class="bi bi-check2"></i></button>
                            </form>
                            <form th:if="${p.status.name() == 'COMPLETED'}"
                                  th:action="@{/payments/{id}/refund(id=${p.id})}" method="post" style="display:inline">
                                <button class="btn-portal btn-ghost btn-sm" onclick="return confirm('Refund this payment?')">
                                    <i class="bi bi-arrow-counterclockwise"></i> Refund
                                </button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>
</div>
<script th:src="@{/js/list-filters.js}"></script>
</body>
</html>
