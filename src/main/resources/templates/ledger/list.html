<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('General Ledger')}"></head>
<body>
<div class="portal-shell">
    <div th:replace="~{fragments/layout :: sidebar('ledger')}"></div>
    <main class="portal-main">
        <div th:replace="~{fragments/layout :: topbar('General Ledger')}"></div>
        <section class="portal-content">
            <div class="portal-card">
                <h3 class="portal-card-title">Account Balances</h3>
                <div th:if="${#lists.isEmpty(ledgers)}" class="empty-state">
                    The General Ledger is empty. Create accounts under
                    <a th:href="@{/accounts}">Chart of Accounts</a>, then post journals to populate balances.
                </div>
                <div th:if="${not #lists.isEmpty(ledgers)}" class="d-flex align-items-center gap-2 flex-wrap mb-3">
                    <label class="visually-hidden" for="ledgerTypeFilter"
                           th:text="#{ledger.filter.typeLabel}">Filter by account type</label>
                    <select id="ledgerTypeFilter" class="form-select form-select-sm" style="width:auto">
                        <option value="" th:text="#{ledger.filter.allTypes}">All types</option>
                        <option th:each="type : ${accountTypes}"
                                th:value="${type.name()}"
                                th:text="${#messages.msg('account.type.' + type.name())}">Asset</option>
                    </select>
                    <label class="visually-hidden" for="ledgerSearch"
                           th:text="#{ledger.filter.searchLabel}">Search general ledger</label>
                    <input id="ledgerSearch" type="search" class="form-control form-control-sm"
                           style="max-width: 20rem" th:placeholder="#{ledger.filter.searchPlaceholder}"/>
                </div>
                <table th:if="${not #lists.isEmpty(ledgers)}" class="table-portal">
                    <thead>
                    <tr>
                        <th th:text="#{table.accountNum}">Account #</th>
                        <th th:text="#{table.accountName}">Account Name</th>
                        <th th:text="#{table.type}">Type</th>
                        <th class="num" th:text="#{table.totalDebits}">Total Debits</th>
                        <th class="num" th:text="#{table.totalCredits}">Total Credits</th>
                        <th class="num" th:text="#{table.balance}">Balance</th>
                        <th th:text="#{table.lastUpdated}">Last Updated</th>
                        <th></th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="gl : ${ledgers}"
                        th:attr="data-account-type=${gl.account.accountType.name()},
                                 data-account-search=${gl.account.accountNumber + ' ' + gl.account.accountName}">
                        <td th:text="${gl.account.accountNumber}">1010</td>
                        <td style="font-weight:500" th:text="${gl.account.accountName}">Cash</td>
                        <td><span class="badge-pill" th:text="${gl.account.accountType}">ASSET</span></td>
                        <td class="num" th:text="${#numbers.formatCurrency(gl.debitBalance)}">$0</td>
                        <td class="num" th:text="${#numbers.formatCurrency(gl.creditBalance)}">$0</td>
                        <td class="num" style="font-weight:600"
                            th:text="${#numbers.formatCurrency(gl.balance)}">$0</td>
                        <td th:text="${gl.lastUpdated}">—</td>
                        <td><a class="btn-portal btn-ghost btn-sm" th:href="@{/ledger/{id}/edit(id=${gl.id})}"
                               th:text="#{ledger.viewAccount}">View Account</a></td>
                    </tr>
                    </tbody>
                </table>
                <div id="ledgerNoMatches" class="empty-state" hidden
                     th:text="#{ledger.filter.noMatches}">No accounts match these filters.</div>
            </div>
        </section>
    </main>
</div>
<script th:if="${not #lists.isEmpty(ledgers)}">
    const ledgerTypeFilter = document.getElementById('ledgerTypeFilter');
    const ledgerSearch = document.getElementById('ledgerSearch');
    const ledgerRows = document.querySelectorAll('tr[data-account-type]');
    const ledgerNoMatches = document.getElementById('ledgerNoMatches');

    function filterLedgerRows() {
        const selectedType = ledgerTypeFilter.value;
        const searchText = ledgerSearch.value.trim().toLowerCase();
        let visibleRows = 0;

        ledgerRows.forEach(row => {
            const matchesType = !selectedType || row.dataset.accountType === selectedType;
            const matchesSearch = !searchText || row.dataset.accountSearch.toLowerCase().includes(searchText);
            const visible = matchesType && matchesSearch;
            row.hidden = !visible;
            if (visible) visibleRows++;
        });

        ledgerNoMatches.hidden = visibleRows > 0;
    }

    ledgerTypeFilter.addEventListener('change', filterLedgerRows);
    ledgerSearch.addEventListener('input', filterLedgerRows);
</script>
</body>
</html>
