<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Customer')}"></head>
<body>
<div class="portal-shell">
    <div th:replace="~{fragments/layout :: sidebar('customers')}"></div>
    <main class="portal-main">
        <div th:replace="~{fragments/layout :: topbar(${isNew} ? 'New Customer' : 'Edit Customer')}"></div>
        <section class="portal-content">
            <div th:replace="~{fragments/layout :: flash}"></div>

            <div class="portal-card">
                <form th:action="${isNew} ? @{/customers} : @{/customers/{id}(id=${customer.id})}"
                      th:object="${customer}" method="post">
                    <div class="form-grid">
                        <div class="form-field">
                            <label>Contact Name</label>
                            <input type="text" th:field="*{name}" required/>
                        </div>
                        <div class="form-field">
                            <label>Business Name</label>
                            <input type="text" th:field="*{businessName}" required/>
                        </div>
                        <div class="form-field">
                            <label>Email</label>
                            <input type="email" th:field="*{email}" required/>
                        </div>
                        <div class="form-field">
                            <label>Business Number</label>
                            <input type="text" th:field="*{businessNumber}"/>
                        </div>
                        <div class="form-field full">
                            <label>Address</label>
                            <input type="text" th:field="*{address}" required/>
                        </div>
                        <div class="form-field">
                            <label>City</label>
                            <input type="text" th:field="*{city}" required/>
                        </div>
                        <div class="form-field">
                            <label>Province</label>
                            <select th:field="*{province}" required>
                                <option value="">Select…</option>
                                <option value="ON">Ontario</option>
                                <option value="QC">Quebec</option>
                                <option value="BC">British Columbia</option>
                                <option value="AB">Alberta</option>
                                <option value="MB">Manitoba</option>
                                <option value="SK">Saskatchewan</option>
                                <option value="NS">Nova Scotia</option>
                                <option value="NB">New Brunswick</option>
                                <option value="NL">Newfoundland and Labrador</option>
                                <option value="PE">Prince Edward Island</option>
                                <option value="YT">Yukon</option>
                                <option value="NT">Northwest Territories</option>
                                <option value="NU">Nunavut</option>
                            </select>
                        </div>
                        <div class="form-field">
                            <label>Postal Code</label>
                            <input type="text" th:field="*{postalCode}" required/>
                        </div>
                        <div class="form-field">
                            <label>Country</label>
                            <input type="text" th:field="*{country}" required/>
                        </div>
                        <div class="form-field full">
                            <label>GST/HST Number</label>
                            <input type="text" th:field="*{gstNumber}"/>
                        </div>
                    </div>

                    <div class="form-actions">
                        <a th:href="@{/customers}" class="btn-portal btn-ghost">Cancel</a>
                        <button type="submit" class="btn-portal">
                            <i class="bi bi-check2"></i>
                            <span th:text="${isNew} ? 'Create Customer' : 'Save Changes'">Save</span>
                        </button>
                    </div>
                </form>
            </div>
        </section>
    </main>
</div>
</body>
</html>
