<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(#{nav.customers})}"></head>
<body>
<div class="portal-shell">
<div th:replace="~{fragments/layout :: sidebar('customers')}"></div>
<main class="portal-main">
<div th:replace="~{fragments/layout :: topbar(${isNew} ? #{party.newCustomer} : #{party.editCustomer})}"></div>
<section class="portal-content"><div th:replace="~{fragments/layout :: flash}"></div>
<div class="portal-card">
<form th:action="${isNew} ? @{/customers} : @{/customers/{id}(id=${customer.id})}" th:object="${customer}" method="post">
<div class="vendor-form-header">
    <label><span th:text="#{party.customerName}">Nom du client</span><input th:field="*{businessName}" required th:placeholder="#{party.companyName}"></label>
    <label><span th:text="#{party.primaryContact}">Contact principal</span><input th:field="*{name}" required th:placeholder="#{party.fullName}"></label>
    <label class="vendor-inactive"><input type="checkbox" th:field="*{inactive}"> <span th:text="#{party.inactiveCustomer}">Client inactif</span></label>
</div>
<nav class="vendor-tabs" role="tablist">
    <button type="button" class="vendor-tab active" data-tab="address" th:text="#{party.addressContact}">Adresse & Contact</button>
    <button type="button" class="vendor-tab" data-tab="payment" th:text="#{party.paymentBilling}">Paiement & Facturation</button>
    <button type="button" class="vendor-tab" data-tab="tax" th:text="#{party.salesTaxes}">Taxes de vente</button>
    <button type="button" class="vendor-tab" data-tab="additional" th:text="#{party.notesInfo}">Notes & Info</button>
</nav>

<!-- Onglet Adresse & Contact -->
<div class="vendor-panel active" id="tab-address">
    <h3 th:text="#{party.contactInformation}">Informations de contact</h3>
    <div class="form-grid">
        <label class="form-field"><span th:text="#{party.companyName}">Nom de la compagnie</span><input th:field="*{companyName}"></label>
        <label class="form-field"><span th:text="#{party.title}">Titre</span><input th:field="*{title}" th:placeholder="#{party.titlePlaceholder}"></label>
        <label class="form-field"><span th:text="#{party.firstName}">Prénom</span><input th:field="*{firstName}"></label>
        <label class="form-field"><span th:text="#{party.middleInitial}">Initiale</span><input th:field="*{middleInitial}"></label>
        <label class="form-field"><span th:text="#{party.lastName}">Nom</span><input th:field="*{lastName}"></label>
        <label class="form-field"><span th:text="#{party.jobTitle}">Poste</span><input th:field="*{jobTitle}"></label>
        <label class="form-field"><span th:text="#{party.mainPhone}">Téléphone principal</span><input th:field="*{mainPhone}"></label>
        <label class="form-field"><span th:text="#{party.workPhone}">Téléphone travail</span><input th:field="*{workPhone}"></label>
        <label class="form-field"><span th:text="#{party.mobile}">Mobile</span><input th:field="*{mobilePhone}"></label>
        <label class="form-field"><span th:text="#{party.fax}">Fax</span><input th:field="*{fax}"></label>
        <label class="form-field"><span th:text="#{party.email}">Email principal</span><input type="email" th:field="*{email}" required></label>
        <label class="form-field"><span th:text="#{party.ccEmail}">Email CC</span><input type="email" th:field="*{ccEmail}"></label>
        <label class="form-field"><span th:text="#{party.website}">Site Web</span><input th:field="*{website}"></label>
        <label class="form-field"><span th:text="#{party.secondaryEmail}">Email secondaire</span><input type="email" th:field="*{secondaryEmail}"></label>
        <label class="form-field full"><span th:text="#{party.billingAddress}">Adresse de facturation</span><textarea th:field="*{address}" required rows="3"></textarea></label>
        <label class="form-field full"><span th:text="#{party.shippingAddress}">Adresse de livraison</span><textarea th:field="*{shipToAddress}" rows="3"></textarea></label>
        <label class="form-field"><span th:text="#{party.city}">Ville</span><input th:field="*{city}" required></label>
        <label class="form-field"><span th:text="#{party.province}">Province/État</span><input th:field="*{province}" required></label>
        <label class="form-field"><span th:text="#{party.postalCode}">Code Postal</span><input th:field="*{postalCode}" required></label>
        <label class="form-field"><span th:text="#{party.country}">Pays</span><input th:field="*{country}" required></label>
    </div>
</div>

<!-- Onglet Paiement -->
<div class="vendor-panel" id="tab-payment">
    <h3 th:text="#{party.paymentSettings}">Paramètres de paiement</h3>
    <div class="form-grid">
        <label class="form-field"><span th:text="#{party.accountNumber}">N° de compte client</span><input th:field="*{accountNumber}"></label>
        <label class="form-field"><span th:text="#{party.creditLimit}">Limite de crédit</span><input type="number" step="0.01" th:field="*{creditLimit}"></label>
        <label class="form-field"><span th:text="#{party.paymentTerms}">Conditions de paiement</span>
            <select th:field="*{paymentTerms}">
                <option value="" th:text="#{select.choose}">Sélectionner...</option>
                <option value="Due on receipt" th:text="#{option.terms.dueOnReceipt}">Dû à la réception</option>
                <option value="Net 15" th:text="#{option.terms.net15}">Net 15 jours</option>
                <option value="Net 30" th:text="#{option.terms.net30}">Net 30 jours</option>
                <option value="Net 60" th:text="#{option.terms.net60}">Net 60 jours</option>
            </select>
        </label>
        <label class="form-field"><span th:text="#{party.billingRateLevel}">Niveau de tarification</span><input th:field="*{billingRateLevel}"></label>
        <label class="form-field"><span th:text="#{party.invoicePrintName}">Nom sur les factures</span><input th:field="*{printOnChequeAs}"></label>
    </div>
</div>

<!-- Onglet Taxes -->
<div class="vendor-panel" id="tab-tax">
    <h3 th:text="#{party.salesTaxes}">Taxes de vente</h3>
    <div class="form-grid">
        <label class="form-field"><span th:text="#{party.businessNumber}">Numéro d'entreprise</span><input th:field="*{businessNumber}"></label>
        <label class="form-field"><span th:text="#{party.salesTaxNumber}">N° de taxes (TPS/HST)</span><input th:field="*{salesTaxRegistrationNumber}"></label>
        <label class="form-field"><span th:text="#{party.provincialTaxNumber}">N° de taxe provincial (TVQ/PST)</span><input th:field="*{qstNumber}"></label>
        
        <div class="tax-section-title" style="grid-column: 1/-1; margin-top: 1rem;" th:text="#{party.taxConfiguration}">Configuration des taxes</div>
        
        <div class="form-field full tax-account-options">
            <span><input type="checkbox" th:field="*{trackSalesTaxSeparately}"> <span th:text="#{party.trackSalesTax}">Suivre la taxe de vente séparément vers</span></span>
            <select th:field="*{salesTaxAccount}">
                <option value="" th:text="#{select.chooseAccount}">Sélectionner un compte...</option>
                <option th:each="a:${accounts}" th:value="${a.id}" th:text="${a.accountNumber+' - '+a.accountName}"></option>
            </select>
        </div>
        
        <label class="form-field full">
            <span><input type="checkbox" th:field="*{taxOnOtherTaxes}"> <span th:text="#{party.taxOnOtherTaxes}">Les taxes pour ce client sont calculées sur les autres taxes</span></span><br/>
            <span><input type="checkbox" th:field="*{taxIncludedOnSales}"> <span th:text="#{party.taxIncludedOnSales}">La taxe est incluse dans les montants de vente</span></span>
        </label>
    </div>
</div>

<!-- Onglet Additionnel -->
<div class="vendor-panel" id="tab-additional">
    <h3 th:text="#{party.additionalNotes}">Informations additionnelles & Notes</h3>
    <div class="form-grid">
        <label class="form-field full"><span th:text="#{party.internalNotes}">Notes internes</span><textarea th:field="*{notes}" rows="10" th:placeholder="#{party.staffOnlyNotes}"></textarea></label>
    </div>
</div>

<div class="form-actions">
    <a th:href="@{/customers}" class="btn-portal btn-ghost" th:text="#{btn.cancel}">Annuler</a>
    <button type="submit" class="btn-portal">
        <i class="bi bi-check2"></i> 
        <span th:text="${isNew} ? #{party.createCustomer} : #{form.saveChanges}">Enregistrer</span>
    </button>
</div>
</form>
</div>
</section>
</main>
</div>

<style>
.vendor-form-header{display:flex;gap:1rem;align-items:end;flex-wrap:wrap;margin-bottom:1rem}
.vendor-form-header label{display:flex;flex-direction:column;gap:.3rem;font-weight:600}
.vendor-form-header input{min-width:220px}
.vendor-inactive{font-weight:400!important}
.vendor-tabs{display:flex;flex-wrap:wrap;gap:.25rem;border-bottom:1px solid var(--portal-border);margin:0 -1rem 1rem;padding:0 1rem}
.vendor-tab{border:0;background:#e5e7eb;padding:.7rem 1rem;cursor:pointer;border-radius:6px 6px 0 0}
.vendor-tab.active{background:var(--portal-primary);color:#fff}
.vendor-panel{display:none;min-height:300px}
.vendor-panel.active{display:block}
.vendor-panel h3{margin-top:0}
.vendor-panel textarea{min-height:70px}
.tax-section-title{grid-column:1/-1;text-transform:uppercase;font-size:.78rem;font-weight:700;border-bottom:1px solid var(--portal-border);padding-bottom:.5rem}
.tax-account-options{display:grid;grid-template-columns:auto 1fr;gap:.6rem;align-items:center}
.tax-account-options select{min-width:260px}
</style>

<script>
document.querySelectorAll('.vendor-tab').forEach(function(tab){
    tab.addEventListener('click',function(){
        document.querySelectorAll('.vendor-tab,.vendor-panel').forEach(function(e){e.classList.remove('active')});
        tab.classList.add('active');
        document.getElementById('tab-'+tab.dataset.tab).classList.add('active')
    })
});
</script>
</body>
</html>
