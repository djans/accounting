<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(#{journals.title})}"></head>
<body>
<div class="portal-shell">
    <div th:replace="~{fragments/layout :: sidebar('journals')}"></div>
    <main class="portal-main">
        <div th:replace="~{fragments/layout :: topbar(#{journals.title})}"></div>
        <section class="portal-content">
            <div th:replace="~{fragments/layout :: flash}"></div>

            <div class="portal-card">
                <div class="portal-card-title">
                    <div class="d-flex align-items-center gap-2 flex-wrap">
                        <span th:text="#{journals.title}">Journal Entries</span>
                        <form th:action="@{/journals}" method="get" class="d-flex align-items-center">
                            <label class="visually-hidden" for="journalStatusFilter"
                                   th:text="#{journals.filter.label}">Filter journal entries by status</label>
                            <select id="journalStatusFilter" name="status"
                                    class="form-select form-select-sm"
                                    onchange="this.form.submit()">
                                <option value="" th:selected="${selectedStatus == null}"
                                        th:text="#{journals.filter.allStatuses}">All statuses</option>
                                <option th:each="status : ${journalStatuses}"
                                        th:value="${status.name()}"
                                        th:selected="${status == selectedStatus}"
                                        th:text="${#messages.msg('journal.status.' + status.name())}">
                                    Draft
                                </option>
                            </select>
                        </form>
                    </div>
                    <a th:href="@{/journals/new}" class="btn-portal">
                        <i class="bi bi-plus-lg"></i>
                        <span th:text="#{journals.newEntry}">New Journal</span>
                    </a>
                </div>
                <div th:if="${#lists.isEmpty(journals) and selectedStatus == null}" class="empty-state">
                    <span th:text="#{journals.noEntries}">No journal entries yet.</span>
                    <a th:href="@{/journals/new}" th:text="#{journals.createOne}">Create one</a>.
                </div>
                <div th:if="${#lists.isEmpty(journals) and selectedStatus != null}" class="empty-state">
                    <span th:text="#{journals.filter.noMatches}">No journal entries match this status.</span>
                    <a th:href="@{/journals}" th:text="#{journals.filter.clear}">Show all statuses</a>.
                </div>
                <div class="d-flex align-items-end gap-2 flex-wrap mb-3"
                     data-list-filter
                     data-rows-selector="#journalEntriesBody tr[data-list-date]"
                     data-no-matches-selector="#journalFilterNoMatches"
                     th:attr="data-current-period-start=${dateFilterPeriods.current != null ? dateFilterPeriods.current.startDate : ''},
                              data-current-period-end=${dateFilterPeriods.current != null ? dateFilterPeriods.current.endDate : ''},
                              data-previous-period-start=${dateFilterPeriods.previous != null ? dateFilterPeriods.previous.startDate : ''},
                              data-previous-period-end=${dateFilterPeriods.previous != null ? dateFilterPeriods.previous.endDate : ''}">
                    <div>
                        <label class="form-label mb-1" for="journalDatePreset"
                               th:text="#{listFilter.dateLabel}">Filter by date</label>
                        <select id="journalDatePreset" class="form-select form-select-sm" data-date-preset>
                            <option value="all" th:text="#{listFilter.allDates}">All dates</option>
                            <option value="this-month" th:text="#{listFilter.thisMonth}">This month</option>
                            <option value="current-period" th:if="${dateFilterPeriods.current != null}"
                                    th:text="#{listFilter.currentPeriod(${dateFilterPeriods.current.agencyCode}, ${dateFilterPeriods.current.startDate}, ${dateFilterPeriods.current.endDate})}">
                                Current tax filing period
                            </option>
                            <option value="" disabled="disabled" th:unless="${dateFilterPeriods.current != null}"
                                    th:text="#{listFilter.noCurrentTaxPeriod}">No open tax filing period</option>
                            <option value="previous-period" th:if="${dateFilterPeriods.previous != null}"
                                    th:text="#{listFilter.previousPeriod(${dateFilterPeriods.previous.agencyCode}, ${dateFilterPeriods.previous.startDate}, ${dateFilterPeriods.previous.endDate})}">
                                Previous tax filing period
                            </option>
                            <option value="" disabled="disabled" th:unless="${dateFilterPeriods.previous != null}"
                                    th:text="#{listFilter.noPreviousTaxPeriod}">No previous filed tax period</option>
                            <option value="this-year" th:text="#{listFilter.thisYear}">This year</option>
                            <option value="last-year" th:text="#{listFilter.lastYear}">Last year</option>
                            <option value="custom" th:text="#{listFilter.customRange}">Custom range</option>
                        </select>
                    </div>
                    <div class="d-flex align-items-end gap-2" data-custom-date-range hidden>
                        <div>
                            <label class="form-label mb-1" for="journalDateFrom"
                                   th:text="#{listFilter.from}">From</label>
                            <input id="journalDateFrom" type="date" class="form-control form-control-sm" data-date-from/>
                        </div>
                        <div>
                            <label class="form-label mb-1" for="journalDateTo"
                                   th:text="#{listFilter.to}">To</label>
                            <input id="journalDateTo" type="date" class="form-control form-control-sm" data-date-to/>
                        </div>
                    </div>
                    <small class="text-danger" data-filter-range-error hidden
                           th:text="#{listFilter.invalidDateRange}">Start date must be before the end date.</small>
                </div>
                <div id="journalFilterNoMatches" class="empty-state" hidden
                     th:text="#{listFilter.noMatches}">No entries match these filters.</div>
                <table th:if="${not #lists.isEmpty(journals)}" class="table-portal">
                    <thead>
                    <tr>
                        <th th:text="#{table.journalNumber}">Journal #</th>
                        <th th:text="#{table.date}">Date</th>
                        <th th:text="#{table.narrative}">Narrative</th>
                        <th th:text="#{table.reference}">Reference</th>
                        <th class="num" th:text="#{table.amount}">Amount</th>
                        <th th:text="#{table.status}">Status</th>
                        <th th:text="#{table.posted}">Posted</th>
                    </tr>
                    </thead>
                    <tbody id="journalEntriesBody">
                    <tr th:each="j : ${journals}" th:attr="data-list-date=${j.journalDate}">
                        <td><a th:href="@{/journals/{id}(id=${j.id})}" th:text="${j.journalNumber}">JL-1</a></td>
                        <td th:text="${j.journalDate}">2026-01-01</td>
                        <td th:text="${j.narrative}">Sale</td>
                        <td th:text="${j.reference}">—</td>
                        <td class="num" th:text="${#numbers.formatCurrency(journalAmounts[j.id])}">$0.00</td>
                        <td>
                            <span class="badge-pill"
                                  th:classappend="${' ' + #strings.toLowerCase(j.status.name())}"
                                  th:text="${#messages.msg('journal.status.' + j.status.name())}">Draft</span>
                        </td>
                        <td th:text="${j.postedDate} ?: '—'">—</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>
</div>
<script th:src="@{/js/list-filters.js}"></script>
</body>
</html>
