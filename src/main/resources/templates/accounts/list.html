<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Plan Comptable')}"></head>
<body>
<div class="portal-shell">
    <div th:replace="~{fragments/layout :: sidebar('accounts')}"></div>
    <main class="portal-main">
        <div th:replace="~{fragments/layout :: topbar('Plan Comptable')}"></div>
        <section class="portal-content">
            <div th:replace="~{fragments/layout :: flash}"></div>

            <div class="portal-card">
                <div class="portal-card-header d-flex justify-content-between align-items-center mb-4">
                    <h3 class="portal-card-title mb-0">Comptes du Grand Livre</h3>
                    <a th:href="@{/accounts/new}" class="btn-portal">
                        <i class="bi bi-plus-lg"></i> Nouveau Compte
                    </a>
                </div>

                <div th:if="${#lists.isEmpty(accounts)}" class="empty-state">
                    Aucun compte pour le moment. <a th:href="@{/accounts/new}">Ajouter le premier compte GL</a>.
                </div>

                <div th:if="${not #lists.isEmpty(accounts)}" class="d-flex align-items-center gap-2 flex-wrap mb-3">
                    <label class="visually-hidden" for="accountTypeFilter"
                           th:text="#{accounts.filter.typeLabel}">Filter by account type</label>
                    <select id="accountTypeFilter" class="form-select form-select-sm" style="width:auto">
                        <option value="" th:text="#{accounts.filter.allTypes}">All types</option>
                        <option th:each="type : ${accountTypes}"
                                th:value="${type.name()}"
                                th:text="${#messages.msg('account.type.' + type.name())}">Asset</option>
                    </select>
                    <label class="visually-hidden" for="accountSearch"
                           th:text="#{accounts.filter.searchLabel}">Search chart of accounts</label>
                    <input id="accountSearch" type="search" class="form-control form-control-sm"
                           style="max-width: 20rem" th:placeholder="#{accounts.filter.searchPlaceholder}"/>
                </div>

                <div th:if="${not #lists.isEmpty(accounts)}" class="table-responsive">
                    <table class="table-portal">
                        <thead>
                        <tr>
                            <th th:text="#{table.accountNum}">N° Compte</th>
                            <th th:text="#{table.accountName}">Nom du Compte</th>
                            <th th:text="#{table.type}">Type</th>
                            <th th:text="#{table.detailCategory}">Détail / Catégorie</th>
                            <th th:text="#{table.currency}">Devise</th>
                            <th th:text="#{accounts.endingBalance}">Solde final</th>
                            <th th:text="#{table.status}">Statut</th>
                            <th class="text-end" th:text="#{table.actions}">Actions</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="a : ${accounts}"
                            th:attr="data-account-type=${a.accountType.name()},
                                     data-account-search=${a.accountNumber + ' ' + a.accountName}">
                            <td>
                                <a th:href="@{/accounts/{id}(id=${a.id})}"
                                   th:text="${a.accountNumber}"
                                   style="text-decoration: none; color: var(--portal-primary);">1010</a>
                            </td>
                            <td style="font-weight:600">
                                <span th:if="${a.parentAccount != null}" class="text-muted ms-2">↳</span>
                                <a th:href="@{/accounts/{id}(id=${a.id})}"
                                   th:text="${a.accountName}"
                                   style="text-decoration: none; color: var(--portal-primary);">Caisse</a>
                            </td>
                            <td>
                                <span class="badge-pill"
                                      th:text="${#messages.msg('account.type.' + a.accountType.name())}">Asset</span>
                            </td>
                            <td class="text-muted small">
                                <span th:text="${a.category != null ? a.category.label : '—'}">Banque</span>
                            </td>
                            <td th:text="${a.currency}">CAD</td>
                            <td class="text-end" style="font-family: monospace;">
                                <span th:text="${#numbers.formatCurrency(accountEndingBalances[a.id])}">0,00 $</span>
                            </td>
                            <td>
                                <span class="badge-pill"
                                      th:classappend="${a.active} ? ' paid' : ' cancelled'"
                                      th:text="${a.active} ? 'Actif' : 'Inactif'"></span>
                            </td>
                            <td class="text-end">
                                <div class="btn-group">
                                    <a th:href="@{/accounts/{id}/edit(id=${a.id})}" class="btn-portal btn-ghost btn-sm">
                                        <i class="bi bi-pencil"></i>
                                    </a>
                                    <form th:action="@{/accounts/{id}/delete(id=${a.id})}" method="post" onsubmit="return confirm('Supprimer ce compte ?')">
                                        <button type="submit" class="btn-portal btn-danger btn-sm ms-1">
                                            <i class="bi bi-trash"></i>
                                        </button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
                <div id="accountNoMatches" class="empty-state" hidden
                     th:text="#{accounts.filter.noMatches}">No accounts match these filters.</div>
            </div>
        </section>
    </main>
</div>
<script th:if="${not #lists.isEmpty(accounts)}">
    const accountTypeFilter = document.getElementById('accountTypeFilter');
    const accountSearch = document.getElementById('accountSearch');
    const accountRows = document.querySelectorAll('tr[data-account-type]');
    const accountNoMatches = document.getElementById('accountNoMatches');

    function filterAccounts() {
        const selectedType = accountTypeFilter.value;
        const searchText = accountSearch.value.trim().toLowerCase();
        let visibleRows = 0;

        accountRows.forEach(row => {
            const matchesType = !selectedType || row.dataset.accountType === selectedType;
            const matchesSearch = !searchText || row.dataset.accountSearch.toLowerCase().includes(searchText);
            const visible = matchesType && matchesSearch;
            row.hidden = !visible;
            if (visible) visibleRows++;
        });

        accountNoMatches.hidden = visibleRows > 0;
    }

    accountTypeFilter.addEventListener('change', filterAccounts);
    accountSearch.addEventListener('input', filterAccounts);
</script>
</body>
</html>
