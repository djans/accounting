<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(#{nav.reconcile})}"></head>
<body>
<div th:replace="~{fragments/layout :: sidebar('accounting')}"></div>
<main class="portal-main">
    <div th:replace="~{fragments/layout :: topbar(#{nav.reconcile})}"></div>
    <section class="portal-content">
        <div th:replace="~{fragments/layout :: flash}"></div>
        <div class="portal-card">
            <h3>Reconcile</h3>
            <table class="table-portal table">
                <thead>
                <tr>
                    <th>Account #</th>
                    <th>Account</th>
                    <th class="num">Balance</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="r : ${rows}">
                    <td th:text="${r.accountNumber}">1001</td>
                    <td th:text="${r.accountName}">Bank A</td>
                    <td class="num" th:text="${r.balance != null ? #numbers.formatCurrency(r.balance) : '-'}">$0.00</td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>
</body>
</html>
