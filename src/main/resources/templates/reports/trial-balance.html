<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(#{nav.trialBalance})}"></head>
<body>
<div class="portal-shell">
    <div th:replace="~{fragments/layout :: sidebar('trial-balance')}"></div>
    <main class="portal-main">
        <div th:replace="~{fragments/layout :: topbar(#{nav.trialBalance})}"></div>
        <section class="portal-content">
        <div th:replace="~{fragments/layout :: flash}"></div>
        <div th:if="${trialBalanceError}" class="flash flash-error" th:text="${trialBalanceError}"></div>
        <div id="tb-error" class="flash flash-error" style="display:none"></div>
        <div class="portal-card">
            <div class="d-flex align-items-center justify-content-between">
                <h3>Trial Balance</h3>
                <div>
                    <a th:href="@{/accounts}" class="btn-portal btn-ghost btn-sm">
                        <i class="bi bi-journal-text"></i> Chart of Accounts
                    </a>
                    <button id="tb-refresh" class="btn-portal btn-sm"><i class="bi bi-arrow-clockwise"></i> Refresh</button>
                    <span id="tb-spinner" class="spinner-border spinner-border-sm ms-2" role="status" aria-hidden="true" style="display:none"></span>
                </div>
            </div>
            <table class="table-portal table">
                <thead>
                <tr>
                    <th>Account #</th>
                    <th>Account</th>
                    <th class="num">Debits</th>
                    <th class="num">Credits</th>
                    <th class="num">Balance</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="acct : ${accountRows}">
                    <td>
                        <a th:href="@{/accounts/{id}/edit(id=${acct['accountId']})}"
                           th:text="${acct['accountNumber']}">1001</a>
                    </td>
                    <td>
                        <a th:href="@{/accounts/{id}/edit(id=${acct['accountId']})}"
                           th:text="${acct['accountName']}">Bank A</a>
                    </td>
                    <td class="num" th:text="${#numbers.formatCurrency(acct['debitBalance'])}">$0.00</td>
                    <td class="num" th:text="${#numbers.formatCurrency(acct['creditBalance'])}">$0.00</td>
                    <td class="num" th:text="${#numbers.formatCurrency(acct['balance'])}">$0.00</td>
                </tr>
                </tbody>
                <tfoot>
                <tr>
                    <td colspan="2">Totals</td>
                    <td class="num" th:text="${#numbers.formatCurrency(totalDebits)}">$0.00</td>
                    <td class="num" th:text="${#numbers.formatCurrency(totalCredits)}">$0.00</td>
                    <td class="num" th:text="${balanced ? 'Balanced' : ''}"></td>
                </tr>
                </tfoot>
            </table>
        </div>
        </section>
    </main>
</div>
    <script>
        (function(){
            const refreshBtn = document.getElementById('tb-refresh');
            const spinner = document.getElementById('tb-spinner');
            const tbody = document.querySelector('tbody');
            const totalDebitsEl = document.querySelector('tfoot td:nth-child(3)');
            const totalCreditsEl = document.querySelector('tfoot td:nth-child(4)');
            const balancedEl = document.querySelector('tfoot td:nth-child(5)');

            function formatCurrency(v){
                try{
                    const n = Number(v);
                    return new Intl.NumberFormat(undefined, {style:'currency', currency:'CAD'}).format(isNaN(n)?0:n);
                } catch(e){
                    return v;
                }
            }

            function render(data){
                if(!data || !data.accounts) return;
                const rows = Object.values(data.accounts).map(acct => {
                    const num = acct['accountNumber'] || '';
                    const name = acct['accountName'] || '';
                    const dr = acct['debitBalance'] || 0;
                    const cr = acct['creditBalance'] || 0;
                    const bal = acct['balance'] || 0;
                    return `<tr>`+
                        `<td>${num}</td>`+
                        `<td>${name}</td>`+
                        `<td class="num">${formatCurrency(dr)}</td>`+
                        `<td class="num">${formatCurrency(cr)}</td>`+
                        `<td class="num">${formatCurrency(bal)}</td>`+
                        `</tr>`;
                }).join('');
                if(tbody) tbody.innerHTML = rows;
                if(totalDebitsEl) totalDebitsEl.textContent = formatCurrency(data.totalDebits);
                if(totalCreditsEl) totalCreditsEl.textContent = formatCurrency(data.totalCredits);
                if(balancedEl) balancedEl.textContent = data.balanced ? 'Balanced' : '';
            }

            let inflight = null;
            function setLoading(on){
                if(spinner) spinner.style.display = on ? '' : 'none';
                if(refreshBtn) refreshBtn.disabled = on;
            }

            function fetchTrialBalance(){
                if(inflight) return;
                setLoading(true);
                inflight = fetch('/api/accounting-reports/trial-balance', {cache:'no-store'})
                    .then(r => { if(!r.ok) throw new Error('Trial balance request failed (' + r.status + ')'); return r.json(); })
                    .then(json => render(json))
                    .catch(err => {
                        console.error('Could not refresh trial balance', err);
                        const message = document.getElementById('tb-error');
                        if (message) {
                            message.textContent = 'Unable to refresh the trial balance.';
                            message.style.display = '';
                        }
                    })
                    .finally(()=>{ inflight = null; setLoading(false); });
            }

            if(refreshBtn) refreshBtn.addEventListener('click', fetchTrialBalance);
            // Initial fetch to ensure latest data
            document.addEventListener('DOMContentLoaded', function(){ fetchTrialBalance(); });
        })();
    </script>
</body>
</html>
