database.migration.documentation.rulesTitle=Validation rules
database.migration.documentation.rulesRecords=Account numbers, emails, document numbers, journal numbers, and source IDs must not be duplicated.
database.migration.documentation.rulesDocuments=Invoices and bills require one or more lines; line_number determines their order. Line totals, subtotals, totals, paid amounts, and payment statuses are validated. paid_amount is imported as an opening balance; payment transaction history is not included.
database.migration.documentation.rulesJournals=Every journal requires at least two balanced lines. Only POSTED and REVERSED journals contribute to general-ledger balances.
database.migration.documentation.rulesFormula=Text values cannot begin with =, +, -, or @.
