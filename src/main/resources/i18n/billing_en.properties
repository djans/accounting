database.migration.documentation.csvTitle=CSV requirements
database.migration.documentation.csvDescription=CSV files use UTF-8, commas, canonical headers in the exact order below, and RFC-style quoted fields. Dates use YYYY-MM-DD; posted_date may be a local ISO date-time. Amounts are non-negative with at most two decimal places, and booleans are lowercase true or false.
database.migration.documentation.referencesTitle=Identifiers and references
database.migration.documentation.referencesDescription=source_id is a package-local identifier, never an application primary key. It must be unique within its file and may contain only letters, digits, periods, underscores, colons, and hyphens.
