database.migration.documentation=Voir la documentation du paquet
database.migration.documentation.title=Documentation de la migration initiale
database.migration.documentation.heading=Paquet de migration initiale des données
database.migration.documentation.back=Retour à la migration
database.migration.documentation.introduction=Utilisez ce format d'importation à usage unique uniquement pour initialiser un nouveau jeu de données comptables. Il ne s'agit pas d'un format de sauvegarde ou de restauration.
database.migration.documentation.safetyTitle=Sécurité et processus d'importation
database.migration.documentation.safetyEmpty=Le domaine comptable cible doit être vide. Les données existantes ne sont jamais remplacées, mises à jour, fusionnées ou supprimées.
database.migration.documentation.safetyValidation=La validation n'écrit aucune donnée et produit un aperçu. Entrez IMPORT pour confirmer un paquet validé dans les 15 minutes.
database.migration.documentation.safetyTransaction=L'importation confirmée est une seule transaction : en cas d'échec, tous les enregistrements créés sont annulés.
database.migration.documentation.safetySeeding=Désactivez l'initialisation des données de référence avant l'importation : APP_SEED_REFERENCE_DATA_ENABLED=false.
database.migration.documentation.zipTitle=Paquet ZIP
database.migration.documentation.zipDescription=Téléversez un fichier ZIP UTF-8 d'au plus 20 Mio. Il doit contenir exactement les fichiers suivants, sans répertoire, doublon ni entrée supplémentaire.
database.migration.documentation.manifestDescription=Le manifeste doit contenir exactement :
database.migration.documentation.csvTitle=Exigences CSV
database.migration.documentation.csvDescription=Les fichiers CSV utilisent UTF-8, des virgules, les en-têtes canoniques ci-dessous dans l'ordre exact et les champs entre guillemets de style RFC. Les dates utilisent AAAA-MM-JJ; posted_date peut être une date-heure ISO locale. Les montants sont non négatifs, avec au plus deux décimales, et les booléens sont true ou false en minuscules.
database.migration.documentation.referencesTitle=Identifiants et références
database.migration.documentation.referencesDescription=source_id est un identifiant local au paquet, jamais une clé primaire de l'application. Il doit être unique dans son fichier et ne peut contenir que des lettres, chiffres, points, traits de soulignement, deux-points et traits d'union.
database.migration.documentation.referenceColumn=Colonne de référence
database.migration.documentation.targetColumn=Fichier cible
database.migration.documentation.quickBooksTitle=Exporter depuis QuickBooks Desktop
database.migration.documentation.quickBooksDescription=Les exportations de QuickBooks Desktop ne correspondent pas directement à ce paquet de migration. Exportez les données sources, puis transformez-les dans les fichiers CSV UTF-8 et le manifeste requis.
database.migration.documentation.quickBooksFileColumn=Fichier de migration
database.migration.documentation.quickBooksSourceColumn=Source QuickBooks Desktop
database.migration.documentation.quickBooksAccounts=Lists > Chart of Accounts
database.migration.documentation.quickBooksCustomers=Customers > Customer Center
database.migration.documentation.quickBooksVendors=Vendors > Vendor Center
database.migration.documentation.quickBooksInvoices=Customers > Customer Center > Transactions, ou Reports > Customers & Receivables
database.migration.documentation.quickBooksBills=Vendors > Vendor Center > Transactions, ou Reports > Vendors & Payables
database.migration.documentation.quickBooksJournals=Reports > Accountant & Taxes > Journal ou General Ledger
database.migration.documentation.quickBooksIif=Selon l'édition, File > Utilities > Export peut exporter des listes ou des transactions en IIF. Les fichiers IIF doivent tout de même être convertis avant l'importation.
database.migration.documentation.quickBooksReports=Les rapports peuvent être exportés vers Excel et servir de source à la conversion.
database.migration.documentation.quickBooksJournal=Utilisez le rapport Journal comme source principale de l'historique comptable. Conservez chaque ligne équilibrée de débit et de crédit.
database.migration.documentation.quickBooksLines=Les exportations de factures clients et fournisseurs doivent inclure toutes les lignes; les rapports sommaires ne suffisent pas.
database.migration.documentation.quickBooksVersion=Les noms de menus et les exportations IIF offertes peuvent varier selon l'édition et la version de QuickBooks Desktop.
database.migration.documentation.rulesTitle=Règles de validation
database.migration.documentation.rulesRecords=Les numéros de comptes, courriels, numéros de documents, numéros de journaux et source_id ne doivent pas être dupliqués.
database.migration.documentation.rulesDocuments=Les factures clients et fournisseurs exigent une ou plusieurs lignes; line_number en détermine l'ordre. Les totaux des lignes, sous-totaux, totaux, montants payés et statuts de paiement sont validés. paid_amount est importé comme solde initial; l'historique des transactions de paiement n'est pas inclus.
database.migration.documentation.rulesJournals=Chaque journal exige au moins deux lignes équilibrées. Seuls les journaux POSTED et REVERSED contribuent aux soldes du grand livre.
database.migration.documentation.rulesFormula=Les valeurs textuelles ne peuvent pas commencer par =, +, - ou @.
