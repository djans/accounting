spring.application.name=accounting
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/accounting?createDatabaseIfNotExist=true
spring.datasource.username=mysql
spring.datasource.password=password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

#spring.datasource.url=jdbc:mysql://acc-mysql:3306/accounting?createDatabaseIfNotExist=true
#spring.datasource.username=mysql
#spring.datasource.password=password
#spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
#spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Execute schema.sql at startup (creates tables via CREATE TABLE IF NOT EXISTS)
spring.sql.init.mode=always

# Hibernate does NOT manage the schema — schema.sql owns it
spring.jpa.hibernate.ddl-auto=none

# Disable template caching in development so edits reload without restart
spring.thymeleaf.cache=false

# Initial-data migration packages are bounded again in the importer before parsing.
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=21MB

# Attachments stay in the database and are served only through authenticated,
# company-scoped endpoints. This is intentionally below the multipart request limit.
app.attachments.max-size=10485760

# Invoice email is opt-in. SMTP credentials are supplied only by the runtime
# environment/configuration, never by this source file.
app.invoice-mail.enabled=${APP_INVOICE_MAIL_ENABLED:false}
app.invoice-mail.from=${INVOICE_MAIL_FROM:}
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
# Use the concise application health indicator instead of Boot's stack-trace logger.
management.health.mail.enabled=false

# Keep current development seeding by default. Disable it before the first
# startup that will receive an initial-data migration package.
app.seed.reference-data.enabled=${APP_SEED_REFERENCE_DATA_ENABLED:false}
# Importing the bundled vendor CSV is intentionally opt-in.
app.seed.vendor-data.enabled=${APP_SEED_VENDOR_DATA_ENABLED:false}

# i18n Configuration
spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false

# These are the first-install credentials. Change them after the initial login.
# Runtime environment variables override both values.
app.bootstrap.admin.email=${APP_BOOTSTRAP_ADMIN_EMAIL:root@example.com}
app.bootstrap.admin.password=${APP_BOOTSTRAP_ADMIN_PASSWORD:password}
