spring.application.name=accounting
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/accounting?createDatabaseIfNotExist=true
spring.datasource.username=mysql
spring.datasource.password=password
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
#spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Execute schema.sql at startup (creates tables via CREATE TABLE IF NOT EXISTS)
spring.sql.init.mode=always

# Hibernate does NOT manage the schema — schema.sql owns it
#spring.jpa.hibernate.ddl-auto=none

# Disable template caching in development so edits reload without restart
spring.thymeleaf.cache=false

